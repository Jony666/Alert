name: OKX V09 Swing Research PAPER ONLY
# Branch-only bootstrap: GitHub dispatch requires registration on the default branch.

on:
  workflow_dispatch:
  push:
    branches: ['research/okx-v09']
    paths: ['.github/workflows/okx-swing-v09.yml']

permissions:
  contents: read

concurrency:
  group: okx-swing-v09-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: okx-monitor/backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: okx-monitor/backtest/requirements.txt
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: All old and new unit tests
        run: python -m unittest discover -p 'test*.py' -v
      - name: Public historical data and paper portfolios only
        run: |
          mkdir -p research_v09_cache
          tar -xzf v09/round2_results/ohlcv.tar.gz -C research_v09_cache
          python -m v09 --start 2022-01-01T00:00:00Z --annual-cohorts --symbols BTC ETH SOL XRP ADA DOGE LINK AVAX LTC BCH DOT TRX ETC FIL UNI AAVE ATOM NEAR ALGO XLM SAND MANA ICP CRV --cache research_v09_cache --instrument-snapshot v09/round2_results/coverage.json --events v09/verified_events.json --output v09_run
          python -m v09.summarize v09_run/summary.json
      - name: Export research evidence even when coverage fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-v09-paper-research
          retention-days: 30
          if-no-files-found: warn
          path: |
            okx-monitor/backtest/v09_run/
            okx-monitor/backtest/research_v09_cache/
