name: OKX V09 Swing Research PAPER ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okx-swing-v09-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: okx-monitor/backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: okx-monitor/backtest/requirements.txt
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: All old and new unit tests
        run: python -m unittest discover -p 'test*.py' -v
      - name: Public historical data and paper portfolios only
        run: python -m v09 --cache research_v09_cache --output v09_run
      - name: Export research evidence even when coverage fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-v09-paper-research
          retention-days: 30
          if-no-files-found: warn
          path: |
            okx-monitor/backtest/v09_run/
            okx-monitor/backtest/research_v09_cache/
