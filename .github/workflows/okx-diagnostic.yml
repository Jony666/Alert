name: OKX Diagnostic Backtest V02

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/okx-diagnostic.yml'
      - 'okx-monitor/backtest/diagnostic_backtest.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: okx-monitor/backtest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: okx-monitor/backtest/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run existing regression tests
        run: python -m unittest -v tests.py
      - name: Run new diagnostic tests
        run: python -m unittest -v test_diagnostic.py
      - name: Run second diagnostic on real OKX candles
        run: >-
          python diagnostic_backtest.py
          --symbols BTC ETH SOL XRP ADA DOGE LINK AVAX
          --days 180
          --warmup 75
          --output diagnostic_v02.json
      - name: Upload full diagnostic counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-diagnostic-v02-results
          if-no-files-found: warn
          retention-days: 30
          path: |
            okx-monitor/backtest/diagnostic_v02.json
            okx-monitor/backtest/diagnostic_v02.csv
