name: OKX Public Trader Strategies Research V04

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/okx-trader-research-v04.yml'

permissions:
  contents: read

concurrency:
  group: okx-public-trader-v04-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: okx-monitor/backtest
    steps:
      - name: Read public source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: okx-monitor/backtest/requirements.txt
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Public trader strategy unit tests
        run: python -m unittest -v test_trader_strategies_v04.py
      - name: Historical research on REAL confirmed OKX candles
        run: >-
          python trader_strategies_v04.py
          --symbols BTC ETH SOL XRP
          --days 730
          --warmup 240
          --end-utc 2026-10-01T00:00:00Z
          --output trader_v04.json
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-public-trader-research-v04-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            okx-monitor/backtest/trader_v04.json
            okx-monitor/backtest/trader_v04.summary.csv
            okx-monitor/backtest/trader_v04.trades.csv
            okx-monitor/backtest/trader_v04.diagnostic.csv
